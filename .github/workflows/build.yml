name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle build + unit test
        run: ./gradlew assembleDebug test --stacktrace
      - name: Lint (best effort, không chặn gate nếu chưa có ktlint)
        run: ./gradlew ktlintCheck || echo "ktlint chưa cấu hình — bỏ qua ở G0"
